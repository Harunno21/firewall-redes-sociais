# Projeto: Controle de Acesso a Sites em Ambiente Corporativo
# Disciplina: Seguranca da Informação
# Objetivo: Simular uma infraestrutura de rede empresarial
# utilizando Docker e um firewall Linux com Iptables.

services:

  # Estacao de trabalho de um funcionario da empresa.
  cliente:
    image: alpine:3.22

    # Define o firewall como gateway padrao do funcionario.
    command:
      - sh
      - -c
      - |
        route del default 2>/dev/null || true
        route add default gw 172.30.10.2 || exit 1
        while true; do sleep 3600; done


    # Permite alterar configurações de rede do container.
    # Sera utilizado posteriormente na configuração das rotas.
    cap_add:
      - NET_ADMIN

    # Conecta o cliente exclusivamente a rede interna.
    networks:
      lan:
        ipv4_address: 172.30.10.10
 
 
 # Firewall responsavel por controlar o trafego entre redes.
  firewall:

    # Constroi a imagem personalizada do firewall.
    build:
      context: ./firewall

    # Executa automaticamente o script com as regras Iptables.
    entrypoint: ["/usr/local/bin/entrypoint.sh"]

    # Mantem o container funcionando apos aplicar as regras.
    command: ["sh", "-c", "while true; do sleep 3600; done"]

    # Permite administrar regras de firewall e roteamento.
    cap_add:
      - NET_ADMIN

    # Habilita o encaminhamento de pacotes IPv4.
    sysctls:
      net.ipv4.ip_forward: "1"

    # Endereco IP autorizado para acesso ao SUAP.
    environment:
      SUAP_IP: ${SUAP_IP}


    # O firewall participa das tres redes do ambiente.
    networks:
      lan:
        ipv4_address: 172.30.10.2
      dmz:
        ipv4_address: 172.30.20.2
      wan: {}

  # Servidor web de teste localizado na DMZ.
  site-empresa:
    image: nginx:alpine

  # Permite configurar a rota de retorno para a LAN.
    cap_add:
      - NET_ADMIN

 
  # Configura a resposta para a LAN usando o firewall.
    command:
      - sh
      - -c
      - |
        route del default 2>/dev/null || true
        route add -net 172.30.10.0 netmask 255.255.255.0 gw 172.30.20.2 || exit 1
        exec nginx -g 'daemon off;'


  # O servidor não participa diretamente da LAN.
    networks:
      dmz:
        ipv4_address: 172.30.20.10

# Definição das redes virtuais do projeto.
networks:

  # LAN: rede interna dos funcionarios.
  lan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24

  # DMZ: rede destinada aos serviços da empresa.
  dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.20.0/24

  # WAN: rede de saida utilizada pelo firewall.
  # Vou fazer o controle de acesso jaja.
  wan:
    driver: bridge
