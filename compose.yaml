
services:
  cliente:
    image: alpine:3.22
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    cap_add:
      - NET_ADMIN
    networks:
      lan:
        ipv4_address: 172.30.10.10

  firewall:
    image: alpine:3.22
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      lan:
        ipv4_address: 172.30.10.2
      dmz:
        ipv4_address: 172.30.20.2
      wan: {}

  site-empresa:
    image: nginx:alpine
    networks:
      dmz:
        ipv4_address: 172.30.20.10

networks:
  lan:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.10.0/24

  dmz:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/24

  wan:
    driver: bridge
